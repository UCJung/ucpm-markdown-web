<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UC Markdown Playground</title>
  </head>
  <body>
    <main class="playground-shell">
      <header>
        <p class="eyebrow">Vanilla API example</p>
        <h1>UC Markdown Playground</h1>
        <p id="status" role="status">편집기를 준비하는 중입니다.</p>
      </header>

      <section class="controls" aria-label="문서 불러오기">
        <label for="fixture-select">문법 시나리오</label>
        <select id="fixture-select">
          <option value="mvp">MVP 문법: 블록·인라인·GFM</option>
        </select>
        <button id="load-fixture" type="button">시나리오 불러오기</button>
        <label for="markdown-input">입력 Markdown</label>
        <textarea id="markdown-input" rows="10" spellcheck="false"></textarea>
        <button id="load-markdown" type="button">Markdown으로 다시 만들기</button>
      </section>

      <section class="controls" aria-label="공개 명령">
        <h2>공개 명령</h2>
        <div class="button-row">
          <button type="button" data-command="bulletList">목록</button>
          <button type="button" data-command="insertTable">표</button>
          <button type="button" data-command="codeBlock">코드 블록</button>
          <button type="button" data-core-command="toggleBold">굵게</button>
          <button id="refresh-markdown" type="button">현재 Markdown 조회</button>
        </div>
      </section>

      <section class="controls" aria-label="안전 붙여넣기">
        <h2>안전 붙여넣기 시나리오</h2>
        <label for="paste-select">fixture</label>
        <select id="paste-select">
          <option value="allowed">허용 HTML: 제목·강조·상대 링크</option>
          <option value="malicious">차단: script·event handler·위험 URL</option>
        </select>
        <button id="run-paste" type="button">편집 DOM에 붙여넣기</button>
      </section>

      <section class="workspace" aria-label="시각 편집기와 결과">
        <div>
          <h2>시각 편집</h2>
          <div id="editor" class="editor-surface"></div>
        </div>
        <div>
          <h2>현재 Markdown</h2>
          <pre id="markdown-output" aria-live="polite"></pre>
          <h2>안전한 편집 DOM</h2>
          <pre id="dom-output"></pre>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
